[package]
name = "cosmic-ext-applet-flowmodoro"
version = "0.2.0"
edition = "2021"
description = "Flowmodoro focus timer applet for the COSMIC panel"
license = "GPL-3.0-only"
repository = "https://github.com/JHPG/cosmic-ext-applet-flowmodoro"

[dependencies]
notify-rust = "4.11"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["applet", "tokio", "wayland", "winit"]

[profile.release]
lto = "thin"
strip = true
